<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="940" viewBox="0 0 1400 940" role="img" aria-labelledby="title desc"><title id="title">crop loop</title><desc id="desc">Three chronological steps. The model requests coordinates, a tool cuts original pixels, and the same model receives the crop with its conversation history.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8" fill="#f87171"/></marker></defs><rect width="1400" height="940" fill="#111827"/><g font-family="Arial, sans-serif"><text x="55" y="70" font-size="44" fill="#f9fafb" font-weight="700" text-anchor="start">One crop run, step by step</text><text x="55" y="112" font-size="24" fill="#9ca3af" font-weight="400" text-anchor="start">The same VLM is called again with the crop added to its conversation</text><text x="60" y="248" font-size="42" fill="#f87171" font-weight="700" text-anchor="start">1</text><rect x="135" y="180" width="410" height="135" rx="16" fill="#1f2937" stroke="#374151" stroke-width="2"/><text x="340" y="255" font-size="25" fill="#f9fafb" font-weight="400" text-anchor="middle">Question + full image</text><path d="M 545 247 L 608.0 247.0" fill="none" stroke="#f87171" stroke-width="3"/><polygon points="620,247 608.0,253.0 608.0,241.0" fill="#f87171"/><rect x="620" y="180" width="330" height="135" rx="16" fill="#f9fafb" stroke="none" stroke-width="2"/><text x="785" y="240" font-size="27" fill="#1f2937" font-weight="700" text-anchor="middle">First model call</text><text x="785" y="277" font-size="21" fill="#4b5563" font-weight="400" text-anchor="middle">Same VLM</text><path d="M 950 247 L 1013.0 247.0" fill="none" stroke="#f87171" stroke-width="3"/><polygon points="1025,247 1013.0,253.0 1013.0,241.0" fill="#f87171"/><text x="1045" y="255" font-size="25" fill="#f9fafb" font-weight="600" text-anchor="start">Crop coordinates</text><text x="60" y="498" font-size="42" fill="#f87171" font-weight="700" text-anchor="start">2</text><rect x="135" y="430" width="410" height="135" rx="16" fill="#1f2937" stroke="#374151" stroke-width="2"/><text x="340" y="505" font-size="25" fill="#f9fafb" font-weight="400" text-anchor="middle">Coordinates + original pixels</text><path d="M 545 497 L 608.0 497.0" fill="none" stroke="#f87171" stroke-width="3"/><polygon points="620,497 608.0,503.0 608.0,491.0" fill="#f87171"/><path d="M 650 430 H 920 L 950 497 L 920 565 H 650 L 620 497 Z" fill="#3a2e12" stroke="#fbbf24" stroke-width="2"/><text x="785" y="490" font-size="27" fill="#fbbf24" font-weight="700" text-anchor="middle">Crop tool</text><text x="785" y="527" font-size="21" fill="#fbbf24" font-weight="400" text-anchor="middle">Cuts pixels</text><path d="M 950 497 L 1013.0 497.0" fill="none" stroke="#f87171" stroke-width="3"/><polygon points="1025,497 1013.0,503.0 1013.0,491.0" fill="#f87171"/><text x="1045" y="505" font-size="25" fill="#f9fafb" font-weight="600" text-anchor="start">New image</text><text x="60" y="748" font-size="42" fill="#f87171" font-weight="700" text-anchor="start">3</text><rect x="135" y="680" width="410" height="135" rx="16" fill="#1f2937" stroke="#374151" stroke-width="2"/><text x="340" y="755" font-size="25" fill="#f9fafb" font-weight="400" text-anchor="middle">Same chat + returned crop</text><path d="M 545 747 L 608.0 747.0" fill="none" stroke="#f87171" stroke-width="3"/><polygon points="620,747 608.0,753.0 608.0,741.0" fill="#f87171"/><rect x="620" y="680" width="330" height="135" rx="16" fill="#f9fafb" stroke="none" stroke-width="2"/><text x="785" y="740" font-size="27" fill="#1f2937" font-weight="700" text-anchor="middle">Next model call</text><text x="785" y="777" font-size="21" fill="#4b5563" font-weight="400" text-anchor="middle">Same VLM</text><path d="M 950 747 L 1013.0 747.0" fill="none" stroke="#f87171" stroke-width="3"/><polygon points="1025,747 1013.0,753.0 1013.0,741.0" fill="#f87171"/><text x="1045" y="755" font-size="25" fill="#f9fafb" font-weight="600" text-anchor="start">Answer or crop again</text><text x="135" y="365" font-size="23" fill="#9ca3af" font-weight="400" text-anchor="start">The model chooses the rectangle. The tool receives that request.</text><text x="135" y="615" font-size="23" fill="#9ca3af" font-weight="400" text-anchor="start">The returned crop is appended as a tool result in the same chat.</text><text x="135" y="890" font-size="24" fill="#f87171" font-weight="600" text-anchor="start">If the model requests another crop, repeat steps 2 and 3. Maximum five image views.</text></g></svg>