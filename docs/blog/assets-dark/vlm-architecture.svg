<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="825" viewBox="0 0 1400 825" role="img" aria-labelledby="title desc"><title id="title">vlm architecture</title><desc id="desc">Image patches and text tokens become embeddings. Both streams enter the language model from the left.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8" fill="#f87171"/></marker></defs><rect width="1400" height="825" fill="#111827"/><g font-family="Arial, sans-serif"><text x="55" y="70" font-size="42" fill="#f9fafb" font-weight="700" text-anchor="start">Pixels and words take different paths</text><text x="55" y="112" font-size="24" fill="#9ca3af" font-weight="400" text-anchor="start">A simplified view of the Gemma 4 design</text><text x="65" y="185" font-size="20" fill="#f87171" font-weight="700" text-anchor="start">IMAGE</text><rect x="65" y="215" width="38" height="38" rx="3" fill="#7dd3fc" stroke="none" stroke-width="2"/><rect x="109" y="215" width="38" height="38" rx="3" fill="#86efac" stroke="none" stroke-width="2"/><rect x="153" y="215" width="38" height="38" rx="3" fill="#fde68a" stroke="none" stroke-width="2"/><rect x="197" y="215" width="38" height="38" rx="3" fill="#cbd5e1" stroke="none" stroke-width="2"/><rect x="65" y="259" width="38" height="38" rx="3" fill="#86efac" stroke="none" stroke-width="2"/><rect x="109" y="259" width="38" height="38" rx="3" fill="#fde68a" stroke="none" stroke-width="2"/><rect x="153" y="259" width="38" height="38" rx="3" fill="#cbd5e1" stroke="none" stroke-width="2"/><rect x="197" y="259" width="38" height="38" rx="3" fill="#7dd3fc" stroke="none" stroke-width="2"/><rect x="65" y="303" width="38" height="38" rx="3" fill="#fde68a" stroke="none" stroke-width="2"/><rect x="109" y="303" width="38" height="38" rx="3" fill="#cbd5e1" stroke="none" stroke-width="2"/><rect x="153" y="303" width="38" height="38" rx="3" fill="#7dd3fc" stroke="none" stroke-width="2"/><rect x="197" y="303" width="38" height="38" rx="3" fill="#86efac" stroke="none" stroke-width="2"/><text x="65" y="385" font-size="22" fill="#9ca3af" font-weight="400" text-anchor="start">Split into patches</text><path d="M 255 278 L 333.0 278.0" fill="none" stroke="#f87171" stroke-width="3"/><polygon points="345,278 333.0,284.0 333.0,272.0" fill="#f87171"/><rect x="345" y="195" width="350" height="185" rx="16" fill="#3f1d1d" stroke="#b91c1c" stroke-width="2"/><text x="520" y="245" font-size="30" fill="#f9fafb" font-weight="700" text-anchor="middle">Vision encoder</text><text x="520" y="287" font-size="22" fill="#f9fafb" font-weight="400" text-anchor="middle">Encode patches</text><text x="520" y="323" font-size="22" fill="#f9fafb" font-weight="400" text-anchor="middle">Pool and project</text><path d="M 695 278 L 758.0 278.0" fill="none" stroke="#f87171" stroke-width="3"/><polygon points="770,278 758.0,284.0 758.0,272.0" fill="#f87171"/><rect x="780" y="274" width="20" height="64" rx="3" fill="#f87171" stroke="none" stroke-width="2"/><rect x="810" y="233" width="20" height="105" rx="3" fill="#f87171" stroke="none" stroke-width="2"/><rect x="840" y="258" width="20" height="80" rx="3" fill="#f87171" stroke="none" stroke-width="2"/><rect x="870" y="218" width="20" height="120" rx="3" fill="#f87171" stroke="none" stroke-width="2"/><rect x="900" y="266" width="20" height="72" rx="3" fill="#f87171" stroke="none" stroke-width="2"/><rect x="930" y="242" width="20" height="96" rx="3" fill="#f87171" stroke="none" stroke-width="2"/><text x="865" y="385" font-size="22" fill="#f87171" font-weight="400" text-anchor="middle">Patch embeddings</text><text x="65" y="505" font-size="20" fill="#fbbf24" font-weight="700" text-anchor="start">QUESTION</text><text x="65" y="565" font-size="27" fill="#f9fafb" font-weight="650" text-anchor="start">Which letter</text><text x="65" y="605" font-size="27" fill="#f9fafb" font-weight="650" text-anchor="start">is circled?</text><path d="M 255 570 L 333.0 570.0" fill="none" stroke="#fbbf24" stroke-width="3"/><polygon points="345,570 333.0,576.0 333.0,564.0" fill="#fbbf24"/><rect x="345" y="485" width="350" height="185" rx="16" fill="#3a2e12" stroke="#b45309" stroke-width="2"/><text x="520" y="535" font-size="29" fill="#f9fafb" font-weight="700" text-anchor="middle">Text embeddings</text><text x="520" y="577" font-size="22" fill="#f9fafb" font-weight="400" text-anchor="middle">Split into tokens</text><text x="520" y="613" font-size="22" fill="#f9fafb" font-weight="400" text-anchor="middle">Look up word vectors</text><path d="M 695 570 L 758.0 570.0" fill="none" stroke="#fbbf24" stroke-width="3"/><polygon points="770,570 758.0,576.0 758.0,564.0" fill="#fbbf24"/><rect x="780" y="540" width="20" height="90" rx="3" fill="#fbbf24" stroke="none" stroke-width="2"/><rect x="810" y="565" width="20" height="65" rx="3" fill="#fbbf24" stroke="none" stroke-width="2"/><rect x="840" y="515" width="20" height="115" rx="3" fill="#fbbf24" stroke="none" stroke-width="2"/><rect x="870" y="545" width="20" height="85" rx="3" fill="#fbbf24" stroke="none" stroke-width="2"/><rect x="900" y="530" width="20" height="100" rx="3" fill="#fbbf24" stroke="none" stroke-width="2"/><rect x="930" y="558" width="20" height="72" rx="3" fill="#fbbf24" stroke="none" stroke-width="2"/><text x="865" y="680" font-size="22" fill="#fbbf24" font-weight="400" text-anchor="middle">Word embeddings</text><path d="M 970 278 L 1028.0 278.0" fill="none" stroke="#f87171" stroke-width="3"/><polygon points="1040,278 1028.0,284.0 1028.0,272.0" fill="#f87171"/><path d="M 970 570 L 1028.0 570.0" fill="none" stroke="#fbbf24" stroke-width="3"/><polygon points="1040,570 1028.0,576.0 1028.0,564.0" fill="#fbbf24"/><rect x="1040" y="195" width="245" height="475" rx="20" fill="#f9fafb" stroke="none" stroke-width="2"/><text x="1162" y="392" font-size="32" fill="#1f2937" font-weight="700" text-anchor="middle">Language</text><text x="1162" y="437" font-size="32" fill="#1f2937" font-weight="700" text-anchor="middle">model</text><text x="1162" y="490" font-size="21" fill="#4b5563" font-weight="400" text-anchor="middle">Reasons over</text><text x="1162" y="522" font-size="21" fill="#4b5563" font-weight="400" text-anchor="middle">both streams</text><path d="M 1285 430 L 1358.0 430.0" fill="none" stroke="#f87171" stroke-width="3"/><polygon points="1370,430 1358.0,436.0 1358.0,424.0" fill="#f87171"/><text x="1370" y="400" font-size="20" fill="#f9fafb" font-weight="400" text-anchor="end">Answer</text><text x="65" y="770" font-size="26" fill="#f9fafb" font-weight="600" text-anchor="start">The vision encoder builds its representation without using the question.</text></g></svg>