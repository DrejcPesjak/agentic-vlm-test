<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="750" viewBox="0 0 1400 750" role="img" aria-labelledby="title desc"><title id="title">results</title><desc id="desc">GPT-5.4 scored 44, 47, and 54 out of 60. GPT-4o scored 34, 33, and 36. The repeat-enabled agents all answered from one view.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8" fill="#007e73"/></marker></defs><rect width="1400" height="750" fill="#f4f1e9"/><g font-family="Arial, sans-serif"><text x="45" y="70" font-size="44" fill="#193339" font-weight="700" text-anchor="start">A bigger gain for GPT-5.4</text><text x="45" y="110" font-size="25" fill="#5d7276" font-weight="400" text-anchor="start">Correct answers out of 60 images   •   One run per condition</text><text x="45" y="180" font-size="34" fill="#193339" font-weight="700" text-anchor="start">GPT-5.4</text><text x="45" y="225" font-size="25" fill="#5d7276" font-weight="400" text-anchor="start">Single view</text><rect x="45" y="243" width="500" height="44" rx="5" fill="#e1e5df" stroke="none" stroke-width="2"/><rect x="45" y="243" width="366.66666666666663" height="44" rx="5" fill="#889b9e" stroke="none" stroke-width="2"/><text x="570" y="275" font-size="30" fill="#193339" font-weight="700" text-anchor="start">44/60</text><text x="45" y="340" font-size="25" fill="#5d7276" font-weight="400" text-anchor="start">Repeat enabled</text><rect x="45" y="358" width="500" height="44" rx="5" fill="#e1e5df" stroke="none" stroke-width="2"/><rect x="45" y="358" width="391.6666666666667" height="44" rx="5" fill="#aec5c6" stroke="none" stroke-width="2"/><text x="570" y="390" font-size="30" fill="#193339" font-weight="700" text-anchor="start">47/60</text><text x="45" y="455" font-size="25" fill="#5d7276" font-weight="400" text-anchor="start">Required crop</text><rect x="45" y="473" width="500" height="44" rx="5" fill="#e1e5df" stroke="none" stroke-width="2"/><rect x="45" y="473" width="450.0" height="44" rx="5" fill="#007e73" stroke="none" stroke-width="2"/><text x="570" y="505" font-size="30" fill="#193339" font-weight="700" text-anchor="start">54/60</text><text x="735" y="180" font-size="34" fill="#193339" font-weight="700" text-anchor="start">GPT-4o</text><text x="735" y="225" font-size="25" fill="#5d7276" font-weight="400" text-anchor="start">Single view</text><rect x="735" y="243" width="500" height="44" rx="5" fill="#e1e5df" stroke="none" stroke-width="2"/><rect x="735" y="243" width="283.3333333333333" height="44" rx="5" fill="#889b9e" stroke="none" stroke-width="2"/><text x="1260" y="275" font-size="30" fill="#193339" font-weight="700" text-anchor="start">34/60</text><text x="735" y="340" font-size="25" fill="#5d7276" font-weight="400" text-anchor="start">Repeat enabled</text><rect x="735" y="358" width="500" height="44" rx="5" fill="#e1e5df" stroke="none" stroke-width="2"/><rect x="735" y="358" width="275.0" height="44" rx="5" fill="#aec5c6" stroke="none" stroke-width="2"/><text x="1260" y="390" font-size="30" fill="#193339" font-weight="700" text-anchor="start">33/60</text><text x="735" y="455" font-size="25" fill="#5d7276" font-weight="400" text-anchor="start">Required crop</text><rect x="735" y="473" width="500" height="44" rx="5" fill="#e1e5df" stroke="none" stroke-width="2"/><rect x="735" y="473" width="300.0" height="44" rx="5" fill="#007e73" stroke="none" stroke-width="2"/><text x="1260" y="505" font-size="30" fill="#193339" font-weight="700" text-anchor="start">36/60</text><rect x="40" y="600" width="1320" height="110" rx="16" fill="#e5ebe6" stroke="none" stroke-width="2"/><text x="65" y="644" font-size="27" fill="#193339" font-weight="600" text-anchor="start">Every repeat-enabled agent stopped after its first view.</text><text x="65" y="681" font-size="24" fill="#5d7276" font-weight="400" text-anchor="start">The view limit was equal. The actual number of views was not.</text></g></svg>