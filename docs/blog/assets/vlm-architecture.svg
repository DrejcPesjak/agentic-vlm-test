<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="825" viewBox="0 0 1400 825" role="img" aria-labelledby="title desc"><title id="title">vlm architecture</title><desc id="desc">Image patches and text tokens become embeddings. Both streams enter the language model from the left.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8" fill="#007e73"/></marker></defs><rect width="1400" height="825" fill="#f4f1e9"/><g font-family="Arial, sans-serif"><text x="55" y="70" font-size="42" fill="#193339" font-weight="700" text-anchor="start">Pixels and words take different paths</text><text x="55" y="112" font-size="24" fill="#5d7276" font-weight="400" text-anchor="start">A simplified view of the Gemma 4 design</text><text x="65" y="185" font-size="20" fill="#007e73" font-weight="700" text-anchor="start">IMAGE</text><rect x="65" y="215" width="38" height="38" rx="3" fill="#9cc8ba" stroke="none" stroke-width="2"/><rect x="109" y="215" width="38" height="38" rx="3" fill="#b6d9d2" stroke="none" stroke-width="2"/><rect x="153" y="215" width="38" height="38" rx="3" fill="#d9b58a" stroke="none" stroke-width="2"/><rect x="197" y="215" width="38" height="38" rx="3" fill="#789d91" stroke="none" stroke-width="2"/><rect x="65" y="259" width="38" height="38" rx="3" fill="#b6d9d2" stroke="none" stroke-width="2"/><rect x="109" y="259" width="38" height="38" rx="3" fill="#d9b58a" stroke="none" stroke-width="2"/><rect x="153" y="259" width="38" height="38" rx="3" fill="#789d91" stroke="none" stroke-width="2"/><rect x="197" y="259" width="38" height="38" rx="3" fill="#9cc8ba" stroke="none" stroke-width="2"/><rect x="65" y="303" width="38" height="38" rx="3" fill="#d9b58a" stroke="none" stroke-width="2"/><rect x="109" y="303" width="38" height="38" rx="3" fill="#789d91" stroke="none" stroke-width="2"/><rect x="153" y="303" width="38" height="38" rx="3" fill="#9cc8ba" stroke="none" stroke-width="2"/><rect x="197" y="303" width="38" height="38" rx="3" fill="#b6d9d2" stroke="none" stroke-width="2"/><text x="65" y="385" font-size="22" fill="#5d7276" font-weight="400" text-anchor="start">Split into patches</text><path d="M 255 278 L 333.0 278.0" fill="none" stroke="#007e73" stroke-width="3"/><polygon points="345,278 333.0,284.0 333.0,272.0" fill="#007e73"/><rect x="345" y="195" width="350" height="185" rx="16" fill="#e1f0eb" stroke="#83aaa0" stroke-width="2"/><text x="520" y="245" font-size="30" fill="#193339" font-weight="700" text-anchor="middle">Vision encoder</text><text x="520" y="287" font-size="22" fill="#193339" font-weight="400" text-anchor="middle">Encode patches</text><text x="520" y="323" font-size="22" fill="#193339" font-weight="400" text-anchor="middle">Pool and project</text><path d="M 695 278 L 758.0 278.0" fill="none" stroke="#007e73" stroke-width="3"/><polygon points="770,278 758.0,284.0 758.0,272.0" fill="#007e73"/><rect x="780" y="274" width="20" height="64" rx="3" fill="#007e73" stroke="none" stroke-width="2"/><rect x="810" y="233" width="20" height="105" rx="3" fill="#007e73" stroke="none" stroke-width="2"/><rect x="840" y="258" width="20" height="80" rx="3" fill="#007e73" stroke="none" stroke-width="2"/><rect x="870" y="218" width="20" height="120" rx="3" fill="#007e73" stroke="none" stroke-width="2"/><rect x="900" y="266" width="20" height="72" rx="3" fill="#007e73" stroke="none" stroke-width="2"/><rect x="930" y="242" width="20" height="96" rx="3" fill="#007e73" stroke="none" stroke-width="2"/><text x="865" y="385" font-size="22" fill="#007e73" font-weight="400" text-anchor="middle">Patch embeddings</text><text x="65" y="505" font-size="20" fill="#bd4d37" font-weight="700" text-anchor="start">QUESTION</text><text x="65" y="565" font-size="27" fill="#193339" font-weight="650" text-anchor="start">Which letter</text><text x="65" y="605" font-size="27" fill="#193339" font-weight="650" text-anchor="start">is circled?</text><path d="M 255 570 L 333.0 570.0" fill="none" stroke="#bd4d37" stroke-width="3"/><polygon points="345,570 333.0,576.0 333.0,564.0" fill="#bd4d37"/><rect x="345" y="485" width="350" height="185" rx="16" fill="#fff0e6" stroke="#d6b197" stroke-width="2"/><text x="520" y="535" font-size="29" fill="#193339" font-weight="700" text-anchor="middle">Text embeddings</text><text x="520" y="577" font-size="22" fill="#193339" font-weight="400" text-anchor="middle">Split into tokens</text><text x="520" y="613" font-size="22" fill="#193339" font-weight="400" text-anchor="middle">Look up word vectors</text><path d="M 695 570 L 758.0 570.0" fill="none" stroke="#bd4d37" stroke-width="3"/><polygon points="770,570 758.0,576.0 758.0,564.0" fill="#bd4d37"/><rect x="780" y="540" width="20" height="90" rx="3" fill="#bd4d37" stroke="none" stroke-width="2"/><rect x="810" y="565" width="20" height="65" rx="3" fill="#bd4d37" stroke="none" stroke-width="2"/><rect x="840" y="515" width="20" height="115" rx="3" fill="#bd4d37" stroke="none" stroke-width="2"/><rect x="870" y="545" width="20" height="85" rx="3" fill="#bd4d37" stroke="none" stroke-width="2"/><rect x="900" y="530" width="20" height="100" rx="3" fill="#bd4d37" stroke="none" stroke-width="2"/><rect x="930" y="558" width="20" height="72" rx="3" fill="#bd4d37" stroke="none" stroke-width="2"/><text x="865" y="680" font-size="22" fill="#bd4d37" font-weight="400" text-anchor="middle">Word embeddings</text><path d="M 970 278 L 1028.0 278.0" fill="none" stroke="#007e73" stroke-width="3"/><polygon points="1040,278 1028.0,284.0 1028.0,272.0" fill="#007e73"/><path d="M 970 570 L 1028.0 570.0" fill="none" stroke="#bd4d37" stroke-width="3"/><polygon points="1040,570 1028.0,576.0 1028.0,564.0" fill="#bd4d37"/><rect x="1040" y="195" width="245" height="475" rx="20" fill="#193339" stroke="none" stroke-width="2"/><text x="1162" y="392" font-size="32" fill="white" font-weight="700" text-anchor="middle">Language</text><text x="1162" y="437" font-size="32" fill="white" font-weight="700" text-anchor="middle">model</text><text x="1162" y="490" font-size="21" fill="#c5d9d4" font-weight="400" text-anchor="middle">Reasons over</text><text x="1162" y="522" font-size="21" fill="#c5d9d4" font-weight="400" text-anchor="middle">both streams</text><path d="M 1285 430 L 1358.0 430.0" fill="none" stroke="#007e73" stroke-width="3"/><polygon points="1370,430 1358.0,436.0 1358.0,424.0" fill="#007e73"/><text x="1370" y="400" font-size="20" fill="#193339" font-weight="400" text-anchor="end">Answer</text><text x="65" y="770" font-size="26" fill="#193339" font-weight="600" text-anchor="start">The vision encoder builds its representation without using the question.</text></g></svg>