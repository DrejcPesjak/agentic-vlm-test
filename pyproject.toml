[project]
name = "vlm-crop"
version = "0.1.0"
description = "Reproducible experiment in model-directed visual cropping"
requires-python = ">=3.10"
dependencies = ["openai>=2.0,<3", "pillow>=11,<13", "pyarrow>=19,<24", "httpx>=0.28,<1", "python-dotenv>=1,<2", "filelock>=3,<4"]

[project.scripts]
vlm-crop = "vlm_crop.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1", "mypy>=1.15,<2", "playwright>=1.50,<2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
